# less-sheet — Flatpak manifest
#
# WHY extra-data AND NOT A SOURCE BUILD. The app needs Zig 0.16.0 exactly, which
# no Flathub SDK carries, and the release pipeline already builds the tarball and
# verifies it by running it, so this manifest ships that binary. extra-data is
# the shape for a prebuilt payload: the manifest carries only metadata, and the
# USER'S machine downloads the same tarball published on the release page,
# verifying the sha256 and size below before unpacking it. What we self-host
# today is the same manifest we would submit — the source is MIT, so a
# from-source manifest with a Zig SDK extension is a possible later step.
#
# WHY THE RUNTIME MATTERS MORE THAN THE PACKAGE. The plain tarball needs GTK
# 4.20 and libadwaita 1.8 from the distribution, which is why it cannot run on
# Debian 13. org.gnome.Platform 49 carries exactly that pair, so the Flatpak
# runs regardless of what the host ships. That is the entire point of shipping
# one.
#
# LGPL: the runtime provides GTK/libadwaita DYNAMICALLY and we do not bundle
# them, which is what keeps the binary compliant (docs/RELEASE.md
# 4a). Do not "simplify" this by vendoring GTK.
app-id: com.lesssheet.LessSheet
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: less-sheet-gtk

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Read-only, and deliberately so: less-sheet is a viewer and never writes to
  # the files it opens, so write access would be permission it cannot justify.
  - --filesystem=host:ro
  # Opening a CSV from a URL is a product feature, not an update check — the app
  # contacts nothing on its own.
  - --share=network

modules:
  - name: less-sheet
    buildsystem: simple
    build-commands:
      # The launcher. The payload lands in /app/extra at install time, which does
      # not exist yet while this builds, so the command on PATH is a wrapper.
      - install -Dm755 less-sheet-gtk.sh /app/bin/less-sheet-gtk
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm644 com.lesssheet.LessSheet.desktop
        /app/share/applications/com.lesssheet.LessSheet.desktop
      - install -Dm644 com.lesssheet.LessSheet.metainfo.xml
        /app/share/metainfo/com.lesssheet.LessSheet.metainfo.xml
      - install -Dm644 com.lesssheet.LessSheet.svg
        /app/share/icons/hicolor/scalable/apps/com.lesssheet.LessSheet.svg
    sources:
      - type: script
        dest-filename: less-sheet-gtk.sh
        commands:
          - exec /app/extra/less-sheet-gtk "$@"

      - type: file
        path: apply_extra

      # ONE definition of the desktop entry, shared with the plain tarball that
      # make_release builds. A second copy here would drift, and an Icon= that
      # no longer matches the app id renders a launcher with no icon and no
      # build error anywhere.
      - type: file
        path: ../linux/com.lesssheet.LessSheet.desktop

      - type: file
        path: com.lesssheet.LessSheet.metainfo.xml

      # The app's own icon, from the GTK component. Same file the binary
      # references at runtime through its GResource path.
      - type: file
        path: ../../apps/gtk/data/com.lesssheet.LessSheet.svg

      # The payload. sha256 and size must match the PUBLISHED asset exactly —
      # flatpak refuses the install otherwise, which is the property that makes
      # downloading a binary at install time safe.
      - type: extra-data
        only-arches: [x86_64]
        filename: less-sheet.tar.gz
        url: https://github.com/te-x/less-sheet/releases/download/v0.1.7/less-sheet-0.1.7-linux-x86_64.tar.gz
        sha256: 6e7e1471e917e5a52becccccac2a4f0c00acbbd31118678919a490e73f6648ec
        size: 1125877

      - type: extra-data
        only-arches: [aarch64]
        filename: less-sheet.tar.gz
        url: https://github.com/te-x/less-sheet/releases/download/v0.1.7/less-sheet-0.1.7-linux-aarch64.tar.gz
        sha256: 4adef921997c104553a870f6a0357ecd0f3926ec8f78d21e277d22675bdb8aa7
        size: 996658

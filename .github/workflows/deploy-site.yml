name: Deploy landing page to GitHub Pages

# The landing page is served from THIS repository's Pages site
# (https://te-x.github.io/less-sheet/), built from site/ on every push that touches
# it. No second repository, no deploy token: the job authenticates with the
# workflow's own OIDC token. Pages must be set to "GitHub Actions" as its source
# once, in the repository settings (and the repository must be public on a Free
# plan for Pages to serve at all).

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

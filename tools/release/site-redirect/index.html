<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>less-sheet has moved</title>
  <!-- The landing page now lives on the main repository's Pages site. GitHub Pages
       cannot issue an HTTP redirect, so this page forwards the old address the
       standard way: an immediate meta refresh, a canonical link so search engines
       transfer the listing, and a script that also carries the query and fragment. -->
  <meta http-equiv="refresh" content="0; url=https://te-x.github.io/less-sheet/">
  <link rel="canonical" href="https://te-x.github.io/less-sheet/">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    location.replace("https://te-x.github.io/less-sheet/" + location.search + location.hash);
  </script>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 15vh auto; max-width: 36em; padding: 0 1.5em; color: #222; }
    a { color: #0a58ca; }
  </style>
</head>
<body>
  <p>less-sheet has moved to
    <a href="https://te-x.github.io/less-sheet/">te-x.github.io/less-sheet</a>.
    You are being forwarded there.</p>
</body>
</html>
